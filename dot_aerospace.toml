# AeroSpace config - using alt as base modifier (triggered by left-option in Kanata / VIAL)
# alt+key = base action (focus, workspace)
# alt+shift+key = move action
# alt+cmd+key = join-with action

after-startup-command = [
    'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0 style=round'
]

# Notify Sketchybar about workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

start-at-login = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
key-mapping.preset = 'qwerty'
on-focus-changed = ['move-mouse window-lazy-center']

[gaps]
inner.horizontal = 4
inner.vertical =   2
outer.left =       3
outer.bottom =     3
outer.top =        [{ monitor.built-in = 8 }, 40]
outer.right =      3

[exec]
inherit-env-vars = true
[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# Main binding mode
[mode.main.binding]

# Terminal launcher
alt-enter = 'exec-and-forget /Applications/kitty.app/Contents/MacOS/kitty --single-instance --instance-group=main'

# Layout switching
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus (hold left-option + hjkl)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows (hold left-option + shift + hjkl)
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Join with (hold left-option + cmd + hjkl)
alt-cmd-h = 'join-with left'
alt-cmd-j = 'join-with down'
alt-cmd-k = 'join-with up'
alt-cmd-l = 'join-with right'

# Resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Toggle floating
alt-f = ['layout floating tiling', 'mode main']

# Fullscreen
alt-space = ['fullscreen']

# Workspaces (hold left-option + number/letter)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-c = 'workspace C'
alt-e = 'workspace E'
alt-p = 'workspace P'
alt-v = 'workspace V'
alt-w = 'workspace W'
alt-z = 'workspace Z'

# Move window to workspace (hold left-option + shift + number/letter)
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-c = 'move-node-to-workspace C'
alt-shift-e = 'move-node-to-workspace E'
alt-shift-p = 'move-node-to-workspace P'
alt-shift-v = 'move-node-to-workspace V'
alt-shift-w = 'move-node-to-workspace W'
alt-shift-z = 'move-node-to-workspace Z'

# Workspace navigation
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Mode switching
alt-shift-semicolon = ['mode service', 'exec-and-forget /usr/local/bin/sketchybar --bar color=0x55ff87ff --set aerospace_mode drawing=on label=Service']
alt-shift-a = ['mode aerospace', 'exec-and-forget /usr/local/bin/sketchybar --bar color=0x55ed879a --set aerospace_mode drawing=on label=Aerospace']

# Service mode
[mode.service.binding]
esc = ['reload-config', 'mode main', 'exec-and-forget /usr/local/bin/sketchybar --bar color=0xff222222 --set aerospace_mode drawing=off', 'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0 style=round']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Aerospace mode (minimal keys, no modifier needed)
[mode.aerospace.binding]
slash = 'layout tiles horizontal vertical'
comma = 'layout accordion horizontal vertical'

minus = 'resize smart -50'
equal = 'resize smart +50'

h = 'focus left'
j = 'focus down'
k = 'focus up'
l = 'focus right'
esc = ['mode main', 'exec-and-forget /usr/local/bin/sketchybar --bar color=0xff222222 --set aerospace_mode drawing=off']
1 = 'workspace 1'
2 = 'workspace 2'
3 = 'workspace 3'
4 = 'workspace 4'
5 = 'workspace 5'
6 = 'workspace 6'
7 = 'workspace 7'
8 = 'workspace 8'
9 = 'workspace 9'
c = 'workspace C'
e = 'workspace E'
p = 'workspace P'
v = 'workspace V'
w = 'workspace W'
z = 'workspace Z'

# Window detection rules
[[on-window-detected]]
if.app-name-regex-substring = 'Finder'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = '1Password'
run = 'layout floating'

# Workspace assignments
[[on-window-detected]]
if.app-name-regex-substring = 'Telegram'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-name-regex-substring = 'Whatsapp'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-name-regex-substring = 'Messages'
run = 'move-node-to-workspace 9'

[[on-window-detected]]
if.app-name-regex-substring = 'Mail'
run = 'move-node-to-workspace E'

[[on-window-detected]]
if.app-name-regex-substring = 'Google Chrome'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-name-regex-substring = 'Arc'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-name-regex-substring = 'Todoist'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-name-regex-substring = 'Notion'
run = 'move-node-to-workspace 8'

[[on-window-detected]]
if.app-name-regex-substring = 'Visual Studio Code'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-name-regex-substring = 'IntelliJ IDEA'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-name-regex-substring = 'kitty'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-name-regex-substring = 'WezTerm'
run = 'move-node-to-workspace 6'

[[on-window-detected]]
if.app-name-regex-substring = 'zoom'
run = ['move-node-to-workspace Z', 'layout floating']

[[on-window-detected]]
if.app-name-regex-substring = 'Discord'
run = ['move-node-to-workspace Z', 'layout floating']

[[on-window-detected]]
if.app-name-regex-substring = 'Slack'
run = 'move-node-to-workspace W'

[[on-window-detected]]
if.app-name-regex-substring = 'Toggl Track'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'System Preferences'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Activity Monitor'
run = 'layout floating'
